<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main">
        <div id="panel">
            <div id="ptop">
                <div class="elem">
                    <h2>Hit</h2>
                    <div id="Hitbox" class="box">0</div>
                </div>
                <div class="elem">
                    <h2>Timer</h2>
                    <div id="timervalue" class="box">60</div>
                </div>
                <div class="elem">
                    <h2>Score</h2>
                    <div id="Scorebox" class="box">0</div>
                </div>
            </div>
            
            <div id="pbtm">
                </div>

            <div class="restartcontainer" id="restartScreen">
                <h1 class="gameover">GAME OVER</h1>
                <h2 id="finalScoreText">Your Score: 0</h2>
                <button id="restartBtn">Restart Game</button>
            </div>
        </div>
    </div>
    <script src="Script.js"></script>
</body>
</html>
